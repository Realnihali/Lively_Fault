<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Lively Fault</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet"/>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

:root{
  --black:#060606;
  --off-black:#0e0e0e;
  --dark:#141414;
  --mid:#1e1e1e;
  --border:#2a2a2a;
  --muted:#555;
  --soft:#888;
  --light:#c8c8c8;
  --white:#f0f0f0;
  --accent:#e8ff47;      /* electric lime — editorial pop */
  --accent2:#ff6b35;     /* warm orange */
  --accent3:#4af0c4;     /* teal */
  --fs:'Syne',sans-serif;
  --fb:'DM Sans',sans-serif;
  --ease:.65s cubic-bezier(.22,1,.36,1);
}

html{scroll-behavior:smooth;font-size:16px;}
body{
  background:var(--black);
  color:var(--white);
  font-family:var(--fb);
  overflow-x:hidden;
  min-height:100dvh;
  cursor:none;
}

/* ── CUSTOM CURSOR (desktop only) ──── */
#cursor,#cursor-ring{display:none;}

@media (pointer:fine){
  body{cursor:none;}
  #cursor{
    display:block;
    position:fixed;width:10px;height:10px;
    background:var(--accent);border-radius:50%;
    pointer-events:none;z-index:9999;
    transform:translate(-50%,-50%);
    transition:width .2s,height .2s,background .2s;
    mix-blend-mode:difference;
  }
  #cursor-ring{
    display:block;
    position:fixed;width:36px;height:36px;
    border:1px solid rgba(232,255,71,.4);
    border-radius:50%;pointer-events:none;z-index:9998;
    transform:translate(-50%,-50%);
    transition:transform .12s ease,width .3s,height .3s,border-color .3s;
  }
  body:has(.btn:hover) #cursor{width:48px;height:48px;}
  body:has(.btn:hover) #cursor-ring{width:56px;height:56px;border-color:var(--accent);}
}

/* Mobile: normal cursor back */
@media (pointer:coarse){
  body{cursor:auto;}
  .btn{cursor:pointer;}
}

/* ── NOISE / GRAIN ─────────────────── */
body::after{
  content:'';position:fixed;inset:0;z-index:1000;pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
  background-size:160px;opacity:.032;
}

/* ── INTRO FULLSCREEN ──────────────── */
#intro{
  position:fixed;inset:0;z-index:500;
  background:var(--black);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  overflow:hidden;
  transition:opacity 1s cubic-bezier(.7,0,.3,1), visibility 1s;
}
#intro.gone{opacity:0;visibility:hidden;pointer-events:none;}

/* Intro background grid */
#intro::before{
  content:'';position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(232,255,71,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(232,255,71,.04) 1px, transparent 1px);
  background-size:60px 60px;
  mask-image:radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 100%);
}

.intro-eyebrow{
  font-family:var(--fs);font-size:.6rem;font-weight:600;
  letter-spacing:.3em;text-transform:uppercase;
  color:var(--accent);margin-bottom:24px;
  opacity:0;animation:fadeUp .8s var(--ease) .3s forwards;
}

/* Big brand name intro */
.intro-wordmark{
  font-family:var(--fs);font-weight:800;
  font-size:clamp(3.2rem,14vw,9rem);
  line-height:.92;letter-spacing:-.03em;
  text-align:center;
  color:var(--white);
  position:relative;
}
.intro-wordmark span{display:block;}
.intro-wordmark .line1{
  opacity:0;transform:translateY(40px);
  animation:slideUp .9s cubic-bezier(.22,1,.36,1) .15s forwards;
}
.intro-wordmark .line2{
  color:var(--accent);
  opacity:0;transform:translateY(40px);
  animation:slideUp .9s cubic-bezier(.22,1,.36,1) .32s forwards;
}

.intro-sub{
  font-family:var(--fb);font-size:.78rem;font-weight:300;
  color:var(--soft);letter-spacing:.12em;text-transform:uppercase;
  margin-top:28px;
  opacity:0;animation:fadeUp .8s var(--ease) .7s forwards;
}

/* Animated accent line */
.intro-line{
  width:0;height:1px;background:var(--accent);
  margin-top:32px;
  animation:expandLine 1s cubic-bezier(.22,1,.36,1) .9s forwards;
}
@keyframes expandLine{to{width:min(200px,40vw)}}

.intro-cta{
  margin-top:36px;
  font-family:var(--fs);font-size:.72rem;font-weight:600;
  letter-spacing:.2em;text-transform:uppercase;
  color:var(--muted);
  opacity:0;animation:fadeUp .8s var(--ease) 1.2s forwards;
  display:flex;align-items:center;gap:10px;
}
.intro-cta::after{
  content:'';width:6px;height:6px;border-radius:50%;
  background:var(--accent);
  animation:blink 1.4s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}

/* Scroll progress bar */
#scroll-bar{
  position:fixed;top:0;left:0;height:2px;
  background:var(--accent);z-index:600;width:0%;
  transition:width .1s linear;
}

/* ── NAV ───────────────────────────── */
nav{
  position:fixed;top:0;left:0;right:0;z-index:200;
  padding:20px 24px;
  display:flex;align-items:center;justify-content:space-between;
  opacity:0;transform:translateY(-10px);
  transition:opacity .6s,transform .6s;
}
nav.visible{opacity:1;transform:none;}
.nav-logo{
  font-family:var(--fs);font-size:.85rem;font-weight:700;
  letter-spacing:.06em;color:var(--white);
}
.nav-logo em{color:var(--accent);font-style:normal;}
.nav-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--accent);
  animation:blink 2s ease-in-out infinite;
}

/* ── MAIN CONTENT ──────────────────── */
main{
  opacity:0;transition:opacity .8s .2s;
  pointer-events:none;
}
main.visible{opacity:1;pointer-events:all;}

/* ── HERO SECTION ──────────────────── */
#hero{
  min-height:100dvh;
  display:flex;flex-direction:column;
  justify-content:flex-end;
  padding:0 24px 56px;
  position:relative;overflow:hidden;
}

/* Hero background image placeholder */
.hero-bg{
  position:absolute;inset:0;
  background:
    linear-gradient(to bottom, transparent 40%, var(--black) 100%),
    linear-gradient(135deg, #0e0e0e 0%, #1a1a1a 100%);
  z-index:0;
}

/* ── HERO PHOTO REVEAL ─────────────── */
#hero-photo{
  position:absolute;inset:0;z-index:1;
  opacity:0;
  pointer-events:none;
  transition:none;
}
#hero-photo.reveal-photo{
  animation:photoReveal 1.2s cubic-bezier(.22,1,.36,1) forwards;
}
@keyframes photoReveal{
  0%  {opacity:0; clip-path:inset(100% 0 0 0);}
  100%{opacity:1; clip-path:inset(0% 0 0 0);}
}

#hero-photo-inner{
  position:absolute;inset:0;
  background-size:cover;
  background-position:center top;
  background-color:#1a1212;
  /* Image added here natively via URL */
  background-image:url('https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjGIglVgTp7zJThJim1m7UfL_X623XizIigoijGo0R1PiA9KnHnRXgs2KsDPOUld3XJku__n6SSP6oimL_oECGugY_rOZXy7y8SOQGU452NC1DvWmjXmi77Mx5DabApAXgVGpNTv9N3P2LYHQaKfEO22OqLSxIRdw6JADeK-IUnQe6oN7zD-kD9VHAsdQo/s3639/InsMix_20251214_202651560.jpg');
}

/* Gradient fade at bottom so text stays readable */
#hero-photo::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(
    to bottom,
    rgba(6,6,6,.05) 0%,
    rgba(6,6,6,.0)  30%,
    rgba(6,6,6,.7)  75%,
    var(--black)    100%
  );
  z-index:1;
}

/* Scan line effect on photo — cinematic */
#hero-photo-inner::after{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,.06) 2px,
    rgba(0,0,0,.06) 4px
  );
  pointer-events:none;
}
.hero-bg-overlay{
  position:absolute;inset:0;z-index:1;
  background:linear-gradient(
    to bottom,
    rgba(6,6,6,.2) 0%,
    rgba(6,6,6,.1) 30%,
    rgba(6,6,6,.85) 80%,
    var(--black) 100%
  );
}

/* Floating grid accent in hero */
.hero-grid{
  position:absolute;inset:0;z-index:1;pointer-events:none;
  background-image:
    linear-gradient(rgba(232,255,71,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(232,255,71,.025) 1px, transparent 1px);
  background-size:40px 40px;
}

/* ── HERO ZONE TEXT ALIGNMENT FIXED ── */
<div class="hero-content" style="position: absolute; bottom: 15px; left: 0; right: 0; z-index: 99; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 24px; box-sizing: border-box; pointer-events: none; margin-bottom: 0;">
  <div class="hero-tag" style="font-size: 0.95rem; letter-spacing: 0.05em; text-transform: none; margin-bottom: 4px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; opacity: 1; transform: none; animation: none;">
    Hii, 👋
  </div>
  
  <h2 class="hero-title" style="font-size: clamp(2.4rem, 11vw, 4rem); line-height: 1.05; letter-spacing: -0.02em; font-weight: 800; text-transform: uppercase; margin: 0; opacity: 1; transform: none; animation: none;">
    Iam an <span style="color: var(--accent); font-family: var(--fs); display: inline-flex; align-items: center; gap: 4px;">alien 👽</span>
  </h2>
  
  <p class="hero-sub" style="font-size: 0.85rem; color: var(--soft); margin-top: 6px; font-weight: 400; letter-spacing: 0.02em; opacity: 1; transform: none; animation: none; margin-bottom: 0;">
    Scroll for more and do follow 👇
  </p>
</div>

    <div class="hero-scroll">
      <span>Scroll</span>
      <div class="hero-scroll-line"></div>
    </div>
  </section>

  <div class="marquee-wrap">
    <div class="marquee-track" id="marqueeTrack"></div>
  </div>

  <section id="features">
    <div class="section-eyebrow reveal">About</div>
    <h2 class="section-title reveal">
      Made<br>
      <span class="muted">with</span><br>
      intent.
    </h2>
    <p class="section-body reveal">Content that feels real. No filter on the voice — only on the lens.</p>

    <div class="feature-grid reveal">
      <div class="feature-card">
        <div class="feature-number">YT</div>
        <div class="feature-label">YouTube</div>
        <p class="feature-desc">Long-form. Deep dives. The full story.</p>
      </div>
      <div class="feature-card">
        <div class="feature-number">IG</div>
        <div class="feature-label">Instagram</div>
        <p class="feature-desc">Moments. Reels. Personal side.</p>
      </div>
    </div>

    <div class="stats-row reveal">
      <div class="stat">
        <div class="stat-num">2</div>
        <div class="stat-label">Platforms</div>
      </div>
      <div class="stat">
        <div class="stat-num">1</div>
        <div class="stat-label">Voice</div>
      </div>
      <div class="stat">
        <div class="stat-num">∞</div>
        <div class="stat-label">Content</div>
      </div>
    </div>
  </section>

  <div class="img-block reveal" id="imgBlock">
    <div class="img-block-inner">
      <span>[ photo placeholder ]</span>
    </div>
    <div class="img-overlay-text">The<br><em>Real</em><br>Side.</div>
  </div>

  <section id="platforms">
    <div class="section-eyebrow reveal">Choose Your Path</div>
    <h2 class="section-title reveal" style="font-size:clamp(1.8rem,7vw,3.2rem);margin-bottom:28px;">
      Where do you<br>want to go?
    </h2>

    <div class="dialogue-box reveal">
      <div class="source-pill" id="sourcePill"></div>
      <div class="dialogue-quote" id="dialogueQuote">
        <span class="dots"><span></span><span></span><span></span></span>
      </div>
    </div>

    <div class="btn-group reveal" id="btnGroup"></div>
  </section>

  <footer>
    <span class="footer-brand">Lively <em>Fault</em></span>
    <span class="footer-copy">All platforms</span>
  </footer>

</main>

<div id="outro"></div>

<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="ico-yt" viewBox="0 0 24 24">
    <path fill="currentColor" d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93 .502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
  </symbol>
  <symbol id="ico-ig" viewBox="0 0 24 24">
    <path fill="currentColor" d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"/>
  </symbol>
</svg>

<script>
(function(){
'use strict';

/* ── CONFIG ──────────────────────── */
const LINKS = {
  youtube:   'https://www.youtube.com/@LivelyFault',
  instagram:'https://www.instagram.com/lively_fault_?'
};
const MESSAGES = {
  instagram: "You came from Instagram. Now heading to the YouTube world.",
  youtube:   "You came from YouTube. Now heading to the personal side on Instagram.",
  default:   "Two platforms. One voice. Where do you want to go?"
};

/* ── DOM ─────────────────────────── */
const intro       = document.getElementById('intro');
const nav         = document.getElementById('nav');
const mainEl      = document.getElementById('main');
const dialogueQ   = document.getElementById('dialogueQuote');
const sourcePill  = document.getElementById('sourcePill');
const btnGroup    = document.getElementById('btnGroup');
const outroEl     = document.getElementById('outro');
const cursor      = document.getElementById('cursor');
const cursorRing  = document.getElementById('cursor-ring');
const scrollBar   = document.getElementById('scroll-bar');

/* ── URL PARAM ───────────────────── */
const params = new URLSearchParams(window.location.search);
const source = (params.get('source')||'').toLowerCase().trim();

/* ── CURSOR (desktop/mouse only) ──── */
const isTouch = window.matchMedia('(pointer:coarse)').matches;
let mx=window.innerWidth/2, my=window.innerHeight/2;
let rx=mx, ry=my;
if(!isTouch){
  document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;},{passive:true});
  (function animCursor(){
    rx+=(mx-rx)*.18; ry+=(my-ry)*.18;
    cursor.style.left=mx+'px'; cursor.style.top=my+'px';
    cursorRing.style.left=rx+'px'; cursorRing.style.top=ry+'px';
    requestAnimationFrame(animCursor);
  })();
}

/* ── SCROLL BAR ──────────────────── */
window.addEventListener('scroll',()=>{
  const h=document.documentElement.scrollHeight-window.innerHeight;
  scrollBar.style.width=(window.scrollY/h*100)+'%';
},{passive:true});

/* ── MARQUEE ─────────────────────── */
const items=[
  {t:'YouTube',h:true},{t:'Original Content'},{t:'Instagram',h:true},
  {t:'Lively Fault'},{t:'Two Platforms',h:true},{t:'One Voice'},
  {t:'YouTube',h:true},{t:'Original Content'},{t:'Instagram',h:true},
  {t:'Lively Fault'},{t:'Two Platforms',h:true},{t:'One Voice'},
];
const track=document.getElementById('marqueeTrack');
[...items,...items].forEach(it=>{
  const d=document.createElement('div');
  d.className='marquee-item'+(it.h?' highlight':'');
  d.innerHTML=`<span class="dot"></span>${it.t}`;
  track.appendChild(d);
});

/* ── INTRO → MAIN (DELAY FIXED TO ULTRA FAST) ── */
let introDone=false;
function revealMain(){
  if(introDone)return;
  introDone=true;
  intro.classList.add('gone');
  nav.classList.add('visible');
  mainEl.classList.add('visible');

  // Photo slides in right away without lag
  setTimeout(()=>{
    const photo = document.getElementById('hero-photo');
    if(photo) photo.classList.add('reveal-photo');
  }, 250);

  setTimeout(initDialogue, 150);
}

// Instant execution on interaction
intro.addEventListener('click',revealMain);
intro.addEventListener('touchstart',() => { revealMain(); }, {passive:true});

// Automatic backup trigger cut down from 4000ms to 1200ms
setTimeout(revealMain, 1200);

/* ── SCROLL REVEAL ───────────────── */
const revealEls=document.querySelectorAll('.reveal');
const io=new IntersectionObserver(entries=>{
  entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }});
},{threshold:.12});
revealEls.forEach(el=>io.observe(el));

/* ── DIALOGUE ────────────────────── */
function showPill(platform){
  if(!platform)return;
  const icons={instagram:'● IG',youtube:'▶ YT'};
  sourcePill.textContent=icons[platform];
  sourcePill.className='source-pill show from-'+(platform==='youtube'?'yt':'ig');
}

function typeText(text){
  return new Promise(resolve=>{
    dialogueQ.classList.add('fading');
    setTimeout(()=>{
      dialogueQ.textContent=text;
      dialogueQ.classList.remove('fading');
      resolve();
    },350);
  });
}

function makeBtn({label,href,type}){
  const a=document.createElement('a');
  const cls=type==='youtube'?'btn-yt':'btn-ig';
  const ico=type==='youtube'?'ico-yt':'ico-ig';
  a.className=`btn ${cls}`;
  a.href='#';
  a.setAttribute('data-href',href);
  a.innerHTML=`
    <span class="btn-left">
      <span class="btn-icon-box">
        <svg width="16" height="16"><use href="#${ico}"/></svg>
      </span>
      ${label}
    </span>
    <span class="btn-arrow">→</span>`;
  a.addEventListener('click',e=>{e.preventDefault();triggerOutro(href,e);});
  a.addEventListener('touchend',e=>{e.preventDefault();triggerOutro(href,e);},{passive:false});
  return a;
}

async function initDialogue(){
  if(source==='instagram'){
    showPill('instagram');
    await typeText(MESSAGES.instagram);
    btnGroup.innerHTML='';
    btnGroup.classList.remove('dual');
    btnGroup.appendChild(makeBtn({label:'Go to YouTube',href:LINKS.youtube,type:'youtube'}));
  } else if(source==='youtube'){
    showPill('youtube');
    await typeText(MESSAGES.youtube);
    btnGroup.innerHTML='';
    btnGroup.classList.remove('dual');
    btnGroup.appendChild(makeBtn({label:'Go to Instagram',href:LINKS.instagram,type:'instagram'}));
  } else {
    await typeText(MESSAGES.default);
    btnGroup.innerHTML='';
    btnGroup.classList.add('dual');
    btnGroup.appendChild(makeBtn({label:'Instagram',href:LINKS.instagram,type:'instagram'}));
    btnGroup.appendChild(makeBtn({label:'YouTube',href:LINKS.youtube,type:'youtube'}));
  }
}

/* ── OUTRO CLICK ANIMATION ───────── */
function triggerOutro(href, e){
  const cx=e.changedTouches?.[0]?.clientX??e.clientX??window.innerWidth/2;
  const cy=e.changedTouches?.[0]?.clientY??e.clientY??window.innerHeight/2;

  // burst dots
  const cols=['#e8ff47','#ff6b35','#4af0c4','#ffffff','#888'];
  for(let i=0;i<20;i++){
    const d=document.createElement('div');
    d.className='burst-dot';
    const sz=4+Math.random()*8;
    const a=Math.random()*Math.PI*2;
    const dist=50+Math.random()*100;
    d.style.cssText=`
      left:${cx}px;top:${cy}px;
      width:${sz}px;height:${sz}px;
      background:${cols[Math.floor(Math.random()*cols.length)]};
      --tx:translateX(${Math.cos(a)*dist}px);
      --ty:translateY(${Math.sin(a)*dist}px);
      animation-delay:${Math.random()*.08}s;
    `;
    document.body.appendChild(d);
    setTimeout(()=>d.remove(),800);
  }

  // fade to black
  setTimeout(()=>outroEl.classList.add('active'),80);
  setTimeout(()=>window.location.href=href, 900);
}

})();
</script>
</body>
</html>
